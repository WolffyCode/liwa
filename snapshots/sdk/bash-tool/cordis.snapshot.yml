# Keyless replay layer for the ordinary SDK snapshot composition.

- id: llm-deepseek
  name: '@liwa/llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@liwa/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
