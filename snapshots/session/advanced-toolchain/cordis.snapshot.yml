# Native inspection, scoped PTC, then native subagents and workflow.
- id: llm-deepseek
  name: '@liwa/llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@liwa/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@liwa/session-persistence-jsonl'
  config:
    root: !!js liwaHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@liwa/agent-instructions'
  config:
    maxBytes: 65536

- id: tool-executor-native
  disabled: false

- id: tool-executor-ptc
  disabled: true

- id: system-prompt
  name: '@liwa/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@liwa/cordis-host-runner'
    - id: cordis-inspect-providers
      name: '@liwa/tool-cordis/host'
    - id: tool-cordis
      name: '@liwa/tool-cordis'
    - id: llm-replay
      name: '@liwa/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: advanced-toolchain-presentation
      name: './presentation.mjs'
