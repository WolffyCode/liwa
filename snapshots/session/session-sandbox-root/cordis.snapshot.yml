# Keyless replay counterpart of session-sandbox-root.cordis.yml: the replay
# swap, recorded model pin, and distinct sandbox fallback form one profile patch.
- id: llm-deepseek
  name: '@liwa/llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@liwa/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@liwa/session-persistence-jsonl'
  config:
    root: !!js liwaHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@liwa/agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@liwa/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: sandbox
  name: '@liwa/sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- id: sandbox-policy
  name: '@liwa/sandbox-policy'
  config:
    mode: !!js process.env.LIWA_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: /tmp
    additionalWritableRoots: !!js "[process.cwd() + '/extra']"

- id: headless-runner
  inject: [headlessStartup]
  config:
    task: !!js ctx.headlessStartup.task
    sessionId: !!js ctx.headlessStartup.sessionId
    json: !!js ctx.headlessStartup.json
    permissionMode: workspace-write

- insert:
    - id: llm-replay
      name: '@liwa/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
