# Keyless replay counterpart of agent-instructions.cordis.yml: apply the
# scenario values and model swap to the ACP profile.
- id: llm-deepseek
  name: '@liwa/llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@liwa/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@liwa/session-persistence-jsonl'
  config:
    root: !!js liwaHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@liwa/agent-instructions'
  config:
    maxBytes: 65536
    projectRootMarkers:
      - .liwa-project

- id: system-prompt
  name: '@liwa/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@liwa/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: workspace-context-compaction
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/workspace-context-compaction.ts'
