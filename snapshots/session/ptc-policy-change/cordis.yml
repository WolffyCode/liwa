# PTC mode adds `ctx.ptcRuntime` and changes the registry to one wire tool,
# `run_code`, plus its generated TypeScript SDK prompt. The demo and snapshot
# recorder apply this profile patch; replay applies its sibling patch.
- insert:
    - id: ptc-mode-change
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/ptc-mode-change.ts'

- id: agent-default-model
  name: '@liwa/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@liwa/session-persistence-jsonl'
  config:
    root: !!js liwaHomePath('sessions')
    compression: !!js 'process.env.LIWA_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@liwa/agent-instructions'
  config:
    maxBytes: 65536

- id: tool-executor-native
  disabled: true

- id: tool-executor-ptc
  disabled: false

- id: system-prompt
  name: '@liwa/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: ptc-runtime
  config:
    executionMode: per-call
