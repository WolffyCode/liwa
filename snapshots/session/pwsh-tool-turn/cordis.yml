# Minimal live counterpart for the pwsh-tool-turn snapshot composition.
- id: llm-deepseek
  name: '@liwa/llm-deepseek-api-key'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@liwa/subprocess-local'

- id: bash-sandbox
  name: '@liwa/bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@liwa/pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@liwa/shell-env'

- id: agent-default-model
  name: '@liwa/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@liwa/session-persistence-jsonl'
  config:
    root: !!js liwaHomePath('sessions')
    compression: !!js 'process.env.LIWA_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@liwa/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@liwa/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: goal
  name: '@liwa/goal'
  disabled: true

- id: goal-round-driver
  name: '@liwa/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@liwa/command-goal'
  disabled: true

- id: tool-goal
  name: '@liwa/tool-goal'
  disabled: true

- id: skill
  name: '@liwa/skill'
  disabled: true

- id: skill-filesystem
  name: '@liwa/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@liwa/tool-skill'
  disabled: true

- id: tool-bash
  name: '@liwa/tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@liwa/tool-pwsh'
  disabled: false
