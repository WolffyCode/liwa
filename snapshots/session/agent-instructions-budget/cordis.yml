# Workspace-context snapshot patch: the harness exports LIWA_HOME=<cwd>/.liwa and
# LIWA_AGENTS_HOME=<cwd>/.agents, so project-root and both user-global root
# discoveries stay inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@liwa/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@liwa/session-persistence-jsonl'
  config:
    root: !!js liwaHomePath('sessions')
    compression: !!js 'process.env.LIWA_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@liwa/agent-instructions'
  config:
    maxBytes: 700
    projectRootMarkers:
      - .liwa-project

- id: system-prompt
  name: '@liwa/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
