[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "liwa-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled liwa CLI runtime for the Liwa Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]

[project.urls]
Homepage = "https://github.com/WolffyCode/liwa"
Documentation = "https://github.com/WolffyCode/liwa/blob/main/python/sdk-runtime/README.md"
Issues = "https://github.com/WolffyCode/liwa/issues"
Source = "https://github.com/WolffyCode/liwa"

[project.scripts]
liwa = "liwa_runtime:main"

# Include the injected liwa executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = [
  "src/liwa_runtime/runtime/liwa-sdk-runtime-*",
  "src/liwa_runtime/runtime/liwa-sdk-runtime-*/**",
  "src/liwa_runtime/runtime/linux-*/**",
  "src/liwa_runtime/runtime/macos-*/**",
  "src/liwa_runtime/runtime/win-*/**",
]
exclude = ["src/liwa_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/liwa_runtime"]
# The release job uses Twine 6.2.0, which accepts core metadata through 2.4.
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
