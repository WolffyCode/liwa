# Keyless generic ACP v1 control-surface patch over `liwa --profile acp`.

- id: llm-deepseek
  name: '@liwa/llm-deepseek-api-key'
  disabled: true

- id: acp
  name: '@liwa/acp'
  config:
    provider: control-fixture
    model: alpha

- id: session-persistence-jsonl
  name: '@liwa/session-persistence-jsonl'
  config:
    root: !!js process.env.LIWA_CONFORMANCE_PERSISTENCE_ROOT
    compression: none

- insert:
    - id: control-surface-llm
      name: './control-surface-llm.ts'
