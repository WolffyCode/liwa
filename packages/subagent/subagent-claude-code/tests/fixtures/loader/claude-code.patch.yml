# Named Claude Code providers and tools over the shipped headless profile.
# No model or product process starts in this test.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- insert:
    - id: fixture
      name: './fixture.ts'

    - id: subagent-claude-code
      name: '@liwa/subagent-claude-code'

    - id: subagent-codex
      name: '@liwa/subagent-codex'

    - id: subagent-claude-primary
      name: '@liwa/subagent-claude-code'
      config:
        providerName: claude-primary
        model: claude-primary-model

    - id: subagent-claude-secondary
      name: '@liwa/subagent-claude-code'
      config:
        providerName: claude-secondary
        model: claude-secondary-model

    - id: tool-subagent-codex
      name: '@liwa/tool-subagent'
      config:
        provider: codex
        toolName: subagent_codex
        maxDepth: 'provider-managed'

    - id: tool-subagent-claude-code
      name: '@liwa/tool-subagent'
      config:
        provider: claude-code
        toolName: subagent_claude_code
        maxDepth: 'provider-managed'

    - id: tool-subagent-claude-primary
      name: '@liwa/tool-subagent'
      config:
        provider: claude-primary
        toolName: subagent_claude_primary
        maxDepth: 'provider-managed'

    - id: tool-subagent-claude-secondary
      name: '@liwa/tool-subagent'
      config:
        provider: claude-secondary
        toolName: subagent_claude_secondary
        maxDepth: 'provider-managed'

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.LIWA_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
