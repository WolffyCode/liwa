- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- insert:
    - id: otel
      name: '@liwa/otel'
    - id: product-telemetry-otel
      name: '@liwa/host-product-telemetry-otel'
      config:
        endpoint: !!js process.env.LIWA_PRODUCT_TELEMETRY_TEST_ENDPOINT
        serviceName: liwa-environment-test
        serviceVersion: synthetic-release
        compression: none
    - id: product-analytics
      name: '@liwa/client-product-analytics'
      config:
        enabled: true
        appVersion: synthetic-release

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.LIWA_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
