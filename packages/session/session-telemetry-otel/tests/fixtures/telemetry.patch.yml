# Test-only patch over the shipped headless profile, which mounts no telemetry:
# the insert below adds the OTel rows and points them at the driver's mock collector.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: cli-mock
        model: cli-mock
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: logger-console
      name: '@liwa/cordis-plugin-logger-console'
      config:
        colors: false
        levels:
          default: 3
        showTime: ''

    - id: cli-mock-llm
      name: '../../../../test-support/loader-smoke/tests/fixtures/cli-mock-llm.ts'

    - id: otel
      name: '@liwa/otel'

    - id: session-telemetry-otel
      name: '@liwa/session-telemetry-otel'
      config:
        mode: !!js process.env.LIWA_TELEMETRY_E2E_MODE ?? 'FEEDBACK_ONLY'
        exporter:
          url: !!js process.env.LIWA_TELEMETRY_E2E_URL
          compression: gzip

    # A deployment may register scrub rules on the telemetry waterfall; the
    # shipped telemetry plugin deliberately owns none.
    - id: telemetry-redact-rule
      name: './telemetry-redact-rule.ts'

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.LIWA_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
