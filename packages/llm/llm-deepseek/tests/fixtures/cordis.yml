- name: '@liwa/llm'
- name: '@liwa/session'
- name: '@liwa/session-projection'
- name: '@liwa/system-prompt'
- name: '@liwa/tools'
- name: '@liwa/tool-executor-native'
- name: '@liwa/agent'
- name: '@liwa/agent-loop'
  config:
    agents: []
- name: '@liwa/credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@liwa/llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
- name: '@liwa/llm-deepseek-account'
  config:
    baseURL: {{endpoint}}
