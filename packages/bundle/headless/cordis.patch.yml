# The liwa-headless bundle patch: one-shot task mode directly over liwa-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin injects `cmdlineArgs`, parses the task positional
# (`liwa --profile headless "<task>"`), Session identity, permission and output
# options, and this app's --help, then the direct driver creates a fresh Agent, or adopts
# the exact Session the flag names, through the core registry and prints its
# durable result.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- insert:
    - id: headless-startup
      name: '@liwa/headless/startup'

    # The brain-provider seam (ctx.brains): agent CLI providers register into it
    # and the member layer opens their sessions through it. The deepseek agent
    # profile does not mount it (no process inside its own process), so it lives
    # in the Liwa-process surface bundles rather than in the shared base.
    - id: brains
      name: '@liwa/brain'
      config:
        membersRoot: !!js liwaHomePath('members')

    # Agent CLI providers. `deepseek` runs Liwa's own agent as one
    # `liwa --profile deepseek` process per session (the deepseek-app bundle of this
    # installation); disable the row to drop the provider. `acp` connects any other
    # ACP agent CLI: enable it and set `command` (one row per CLI, each with its own
    # `impl`); Paseo's vendor shims are selected by `vendor`.
    - id: brain-deepseek
      name: '@liwa/brain-deepseek'

    - id: brain-acp
      name: '@liwa/brain-acp'
      disabled: true
      config:
        impl: acp
        command: []

    # Reads its task and run options from the ordinary headlessStartup provider.
    - id: headless-runner
      name: '@liwa/headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
        sessionId: !!js ctx.headlessStartup.sessionId
        json: !!js ctx.headlessStartup.json

# Replacing config retains the base mode/root defaults while adding the CLI grants.
- id: sandbox-policy
  inject: [headlessStartup]
  config:
    mode: !!js process.env.LIWA_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
    additionalWritableRoots: !!js ctx.headlessStartup.additionalWritableRoots

- id: hmr
  disabled: true

# One-shot jobs use launch-time credentials instead of the interactive store.
- id: credentials
  disabled: true

- id: authorization
  disabled: true
