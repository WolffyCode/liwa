# The SDK application over liwa-base. Stdout belongs exclusively to JSON-RPC.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: sdk-app-startup
      name: '@liwa/sdk-app'
      config:
        profile: sdk

    - id: sdk-jsonrpc-server
      name: '@liwa/sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: !!js "process.env.LIWA_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.LIWA_MAX_TOKENS_AS_SUCCESS)"

- id: hmr
  disabled: true

# LIWA_PRIMARY_RUNTIME names a prepared payload; unset or empty leaves both rows disabled.
# Each row can be patched independently.
- insert:
    - id: workspace-dependencies
      name: '@liwa/tool-workspace-dependencies'
      disabled: !!js "!process.env.LIWA_PRIMARY_RUNTIME"
      config:
        source: !!js "process.getBuiltinModule('node:path').resolve(process.env.LIWA_PRIMARY_RUNTIME ?? '')"

    - id: skill-office
      name: '@liwa/skill-office'
      disabled: !!js "!process.env.LIWA_PRIMARY_RUNTIME"
      config:
        assetRoot: !!js "process.getBuiltinModule('node:path').resolve(process.env.LIWA_PRIMARY_RUNTIME ?? '', '..', 'office-skills')"
        node: !!js "process.getBuiltinModule('node:path').resolve(process.env.LIWA_PRIMARY_RUNTIME ?? '', 'dependencies', 'node', 'bin', process.platform === 'win32' ? 'node.exe' : 'node')"

# Share native desktop tools and model context without starting a Web server.
- insert:
    - id: connection
      name: '@liwa/client-connection'

    - id: file-upload
      name: '@liwa/client-file-upload'

    - id: workspace
      name: '@liwa/workspace'

    - id: schedule
      name: '@liwa/schedule'
      inject: [sdkSessionActivation]

    - id: time-context
      name: '@liwa/time-context'

    - id: tool-schedule
      name: '@liwa/tool-schedule'

    - id: tool-ask-user
      name: '@liwa/tool-ask-user'

    - id: present
      name: '@liwa/tool-present'

    - id: file-reference-local
      name: '@liwa/file-reference-local'

    - id: deliverable-file-references
      name: '@liwa/deliverable-file-references'
