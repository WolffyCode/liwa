# The liwa-brain-cli bundle patch: the `liwa brain` command over liwa-base.
# `liwa brain <subcommand>` boots the `brain` profile; the startup row parses
# `list`, `probe <impl>`, and `run --provider <impl> "<prompt>"` from the
# launcher's inner arguments, and the runner executes the command against
# ctx.brains, then exits. Providers are whatever brain-provider plugins the
# profile mounts: `deepseek` by default, the generic `acp` row switched off
# until configured, and the test-only scripted provider only through an
# explicit --patch overlay.

- insert:
    # The brain-provider seam; members' CLI configuration lives under the
    # Liwa home, one directory per member.
    - id: brains
      name: '@liwa/brain'
      config:
        membersRoot: !!js liwaHomePath('members')

    # Agent CLI providers. `deepseek` runs Liwa's own agent as one
    # `liwa --profile deepseek` process per session (the deepseek-app bundle of this
    # installation); disable the row to drop the provider. `acp` connects any other
    # ACP agent CLI: enable it and set `command` (one row per CLI, each with its own
    # `impl`); Paseo's vendor shims are selected by `vendor`.
    - id: brain-deepseek
      name: '@liwa/brain-deepseek'

    - id: brain-acp
      name: '@liwa/brain-acp'
      disabled: true
      config:
        impl: acp
        command: []

    # Claude Code instances: one row per provider; key and endpoint go into env like Paseo custom providers.
    - id: brain-claude-code
      name: '@liwa/brain-claude-code'
      disabled: true
      config:
        impl: claude-reclaude
        label: Claude via reclaude
        env:
          ANTHROPIC_API_KEY: replace-with-the-reclaude-key
          ANTHROPIC_BASE_URL: http://127.0.0.1:8080
        models:
          - id: sonnet
            label: Sonnet
            isDefault: true
    - id: brain-claude-code-glm
      name: '@liwa/brain-claude-code'
      disabled: true
      config:
        impl: claude-glm
        label: GLM via Claude Code
        env:
          ANTHROPIC_AUTH_TOKEN: replace-with-the-zai-key
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          API_TIMEOUT_MS: '3000000'
        disallowedTools: [WebSearch]
        models:
          - id: glm-5-turbo
            label: GLM 5 Turbo
            isDefault: true

    - id: brain-cli-startup
      name: '@liwa/brain-cli/startup'

    - id: brain-cli
      name: '@liwa/brain-cli'
      config:
        # The global agent configuration set (skills, MCP servers, plugins, hooks, instructions) under the Liwa home.
        agentsRoot: !!js liwaHomePath('agents')

- id: hmr
  disabled: true

# One-shot commands use launch-time credentials instead of the interactive store.
- id: credentials
  disabled: true

- id: authorization
  disabled: true
